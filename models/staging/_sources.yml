version: 2

sources:
  - name: jaffle_shop
    database: dbt-learning-path-496700
    schema: dbt_nanli_raw
    tables:
      - name: raw_customers
        columns:
          - name: id
            data_tests:
                - unique
                - not_null

      - name: raw_items
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name: raw_orders
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
          loaded_at_field: ordered_at
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name: raw_products
        columns:
          - name: sku
            data_tests:
              - unique
              - not_null      
              
      - name: raw_stores
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name: raw_supplies