version: 2

models:

  - name: dim_customer_lifetime_value
    description: >
      Fact table at customer grain. Aggregates order history per customer
      to calculate lifetime revenue, order count, and average order value.
      Used to answer "which customers/segments drive the most long-term revenue."
    columns:
      - name: customer_id
        description: Primary key. One row per customer.
        tests:
          - unique
          - not_null
      - name: lifetime_value
        description: Total revenue generated by this customer across all orders, in USD.
      - name: average_order_value
        description: Average order value for this customer, in USD.


  - name: fct_customer_product_lifetime_summary
    description: >
      Customer-product summary model that attaches each customer's lifetime value
      to the products they purchased and shows the number of purchases and
      revenue per product.
    config:
      materialized: view
    columns:
      - name: customer_id
        description: Surrogate or business key for the customer
      - name: customer_name
        description: Customer display name
      - name: lifetime_value
        description: Total lifetime customer value
      - name: sku
        description: Product SKU
      - name: product_name
        description: Product name
      - name: product_type
        description: Product category or type
      - name: times_purchased
        description: Number of times the product was purchased by the customer
      - name: product_revenue
        description: Total revenue generated by the product for the customer

  - name: fct_orders_products
    description: >
      Fact table joining orders to product-level detail. One row per
      product ordered, enriched with product attributes.
    columns:
      - name: order_id
        description: Primary key for the order
        tests:
        - not_null
      - name: sku
        description: Product SKU
        tests:
          - not_null


  - name: fct_product_sales_daily
    description: >
      Fact table summarizing daily product sales. One row per product per day.
      Supports trend analysis over time.
 