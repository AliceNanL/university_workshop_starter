version: 2

models:

  - name: dim_customer_lifetime_value
    description: >
      Fact table at customer grain. Aggregates order history per customer
      to calculate lifetime revenue, order count, and average order value.
      Used to answer "which customers/segments drive the most long-term revenue."
    columns:
      - name: customer_id
        description: Primary key. One row per customer.
        tests:
          - unique
          - not_null
      - name: lifetime_value
        description: Total revenue generated by this customer across all orders, in USD.
      - name: average_order_value
        description: Average order value for this customer, in USD.


  - name: fct_orders_products
    description: >
      Fact table joining orders to product-level detail. One row per
      product ordered, enriched with product attributes.
    columns:
      - name: order_product_id
        description: Primary key.
        tests:
          - unique
          - not_null


  - name: fct_product_sales_daily
    description: >
      Fact table summarizing daily product sales. One row per product per day.
      Supports trend analysis over time.
    columns:
      - name: product_sales_daily_id
        description: Primary key (composite of product_id and sale_date).
        tests:
          - unique
          - not_null